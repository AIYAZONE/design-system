<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jackery Design System</title>
  <!-- <link rel="stylesheet" href="./src/styles/index.less" /> -->
  <link rel="stylesheet" href="./src/styles/default.css" />
</head>

<body>
  <jds-badge style="
        --jds-badge-bg-color: var(--jds-color-success-contrast);
        --jds-badge-color: var(--jds-color-success);
      ">Hot</jds-badge>
  <jds-icon name="close" size="64"></jds-icon>
  <jds-button size="large">按钮</jds-button>
  <jds-button size="medium">按钮</jds-button>
  <jds-button size="large" icon="info">Primary Button</jds-button>
  <jds-button size="medium" icon="info">Primary Button</jds-button>
  <jds-button size="small" icon="info">Primary Button</jds-button>
  <jds-spinner></jds-spinner>

  <jds-button variant="secondary" @click="showDialog()">Open Dialog</jds-button>

  <jds-dialog id="dl-basic" caption="Use location service?">
    Let us help determine location. This means sending anonymous location data
    to us.

    <jds-button slot="primary-action" variant="primary" size="large">Agree</jds-button>
    <jds-button slot="secondary-action" variant="secondary" size="large">Disagree</jds-button>
    <jds-button slot="tertiary-action" variant="tertiary" size="large">Cancel</jds-button>
  </jds-dialog>

  <script type="module" src="src/index.ts"></script>
  <script>
    function showDialog() {
      const dialog = document.querySelector('#dl-basic');
      dialog.setAttribute('open', true);
    }
  </script>
</body>

</html>
