<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badge - 徽章</title>
  <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../styles/index.less" />
  <link rel="stylesheet" href="../styles/public.less" />
  <link rel="stylesheet" href="../styles/index.less" />
</head>

<body>
  <div class="container">
    <header class="header">
      <a href="/" class="logo">
        <img src="/favicon.svg" alt="Jackery Logo" />
      </a>
      <div class="content">
        <h1>Badge 徽章组件</h1>
        <p class="subtitle">各种样式和状态的徽章展示</p>
      </div>
    </header>

    <main>
      <h2>徽章样式</h2>
      <p>
        <jds-badge style="--jds-badge-bg-color:rgb(254, 242, 232);--jds-badge-color:rgb(242, 122, 26);">In Progress</jds-badge>
        <jds-badge style="--jds-badge-bg-color:var(--jds-color-success-contrast);--jds-badge-color:var(--jds-color-success);">Approved</jds-badge>
        <jds-badge style="--jds-badge-bg-color:var(--jds-color-warning-contrast);--jds-badge-color:var(--jds-color-warning);">Warning</jds-badge>
        <jds-badge style="--jds-badge-bg-color:var(--jds-color-danger-contrast);--jds-badge-color:var(--jds-color-danger);">Denied</jds-badge>
        <jds-badge style="--jds-badge-bg-color:var(--jds-color-neutral-100);--jds-badge-color:var(--jds-color-neutral-400);">Neutral</jds-badge>
        <jds-badge style="--jds-badge-bg-color:#eef4ff;--jds-badge-color:#5794ff;">Offer</jds-badge>
        <jds-badge style="--jds-badge-bg-color:#f4edff;--jds-badge-color:#8c4eff;">Winner</jds-badge>
      </p>

      <script type="module" src="../../index.ts"></script>
    </main>
  </div>
</body>

</html>
