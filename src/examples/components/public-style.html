<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDS 通用样式技巧</title>
  <link rel="stylesheet" href="../../styles/index.less" />
  <style>
    section {
      margin: 10px;
    }
  </style>
</head>

<body>
  <section>
    <h2>本项目LESS文件 变量对应值使用 @vw计算失效</h2>
    <pre>
      @base: 750;
      @vw: (1vw / @base) * 100;
      .button {
        --height: 80 * @vw; // Error - 失效
        --height: 10.6667vw; // 生效 80px
        --height: max(0, 80 * @vw); // 生效 80px
        height: 80 * @vw; // 生效 80px
      }
    </pre>
  </section>

</body>

</html>
