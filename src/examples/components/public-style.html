<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDS 通用样式技巧</title>
  <link rel="stylesheet" href="../../styles/index.less" />
  <style>
    section {
      margin: 10px;
    }
  </style>
</head>
<body>
  <section>
    <h2>富文本小技巧</h2>
    弹窗内容元素添加 `jds-rte` 类名，保留富文本样式，示例：
    <div class="jds-rte">
      <ol>
        <li>123123</li>
        <li>123123</li>
        <li>123123</li>
      </ol>
      <ul>
        <li>123123</li>
        <li>123123</li>
        <li>123123</li>
      </ul>
    </div>
  </section>
</body>
</html>
