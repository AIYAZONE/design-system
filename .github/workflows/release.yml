name: Release

# push v* 标签触发：经 npm Trusted Publishing (OIDC) 发布，
# 仓库不存储任何 npm token。需在 npm 包设置中配置 Trusted Publisher：
#   owner=AIYAZONE · repo=design-system · workflow=release.yml
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 重试已有发布标签（例如 v0.4.0）
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 临时凭证（trusted publishing 必需）
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.release_ref || github.ref }}
    permissions:
      contents: read
    secrets: inherit

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm（读取 packageManager 字段）
        uses: pnpm/action-setup@v6

      # npm ≥ 11.5 才支持 OIDC trusted publishing；node 22 自带 npm 10.x，显式升级
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm（OIDC 发布要求 ≥ 11.5）
        run: npm install -g npm@latest

      - name: 检查 OIDC 发布环境
        run: |
          node --version
          npm --version
          node -e "for (const key of ['ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN']) { console.log(key + ' present: ' + Boolean(process.env[key])); if (!process.env[key]) process.exitCode = 1; }"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 校验标签与版本一致
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::发布引用必须是版本标签"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          TAG="${RELEASE_REF#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$ROOT_VERSION" ]; then
            echo "::error::标签 v$TAG 与 package.json 版本 $ROOT_VERSION 不一致"
            exit 1
          fi
          echo "发布版本：$ROOT_VERSION ✓"

      - name: Build
        run: |
          pnpm run release:check
          pnpm run build
          pnpm run design:build
          mkdir release-packages
          pnpm run packages:test --record release-artifacts.json --pack-dir release-packages

      - name: Save release artifact record
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ inputs.release_ref || github.ref_name }}
          path: |
            release-artifacts.json
            release-packages/*.tgz

      - name: Publish @aiyazone/tokens
        working-directory: packages/tokens
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish ../../release-packages/aiyazone-tokens.tgz --loglevel=verbose
          fi

      - name: Publish @aiyazone/design-system
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish ./release-packages/aiyazone-design-system.tgz --loglevel=verbose
          fi
