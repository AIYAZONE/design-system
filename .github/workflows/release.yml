name: Release

# push v* 标签触发：经 npm Trusted Publishing (OIDC) 发布，
# 仓库不存储任何 npm token。需在 npm 包设置中配置 Trusted Publisher：
#   owner=AIYAZONE · repo=design-system · workflow=release.yml
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # OIDC 临时凭证（trusted publishing 必需）
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm（读取 packageManager 字段）
        uses: pnpm/action-setup@v6

      # npm ≥ 11.5 才支持 OIDC trusted publishing；node 22 自带 npm 10.x，显式升级
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm（OIDC 发布要求 ≥ 11.5）
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 校验标签与版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$ROOT_VERSION" ]; then
            echo "::error::标签 v$TAG 与 package.json 版本 $ROOT_VERSION 不一致"
            exit 1
          fi
          echo "发布版本：$ROOT_VERSION ✓"

      - name: Build
        run: |
          pnpm run build
          pnpm run design:build

      - name: Publish @aiyazone/tokens
        working-directory: packages/tokens
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish
          fi

      - name: Publish @aiyazone/design-system
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "已存在，跳过"
          else
            npm publish
          fi
