name: CI

on:
  push:
    branches: [master, develop, stage]
  pull_request:
    branches: [master, develop, stage]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 无该 Secret 时视觉回归步骤自动跳过；配置后 PR 自动产出 diff 与基线审批
  CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

jobs:
  quality:
    name: Build · Type · Test · Tokens · Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm（读取 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build（全部包）
        run: pnpm run build

      - name: Type check
        run: pnpm run type-check

      - name: Test（单测 + a11y 断言）
        run: pnpm run test

      - name: Tokens check（令牌生成物防漂移）
        run: pnpm run tokens:check

      - name: Tokens lint（禁止新增裸 hex）
        run: pnpm run tokens:lint

      - name: Docs check（CEM / 清单 / API 文档 / llms 与源码同步）
        run: pnpm run docs:check

      - name: Build storybook（视觉回归前置）
        run: pnpm --filter @aiyazone/storybook run build:storybook

      - name: Storybook test-runner（79 stories 渲染冒烟，playwright-core 起 Chromium）
        run: |
          pnpm --filter @aiyazone/storybook exec playwright-core install chromium
          pnpm --filter @aiyazone/storybook run test:storybook

      - name: Visual regression（Chromatic，未配置 Secret 时跳过）
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        working-directory: apps/storybook
        run: pnpm exec chromatic --storybook-build-dir=storybook-static --exit-once-uploaded
