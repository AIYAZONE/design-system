name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: 要验证的发布标签；为空时验证触发提交
        required: false
        type: string
        default: ''
  push:
    branches: [master, develop, stage]
  pull_request:
    branches: [master, develop, stage]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 无该 Secret 时视觉回归步骤自动跳过；配置后 PR 自动产出 diff 与基线审批
  CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

jobs:
  quality:
    # 保护规则按此名称匹配；新增检查步骤时保持名称稳定。
    name: Build · Type · Test · Tokens · Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0 # Chromatic 需要完整 git 历史定位基线提交（浅克隆会报 "Found only one commit"）

      - name: Setup pnpm（读取 packageManager 字段）
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build（全部包）
        run: pnpm run build

      - name: Build published bundle
        run: pnpm run design:build

      - name: Package exports and installed consumer
        run: |
          pnpm run release:check
          pnpm run packages:check
          pnpm run packages:check:lit
          pnpm run packages:test

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Test（单测 + a11y 断言）
        run: pnpm run test

      - name: Tokens check（令牌生成物防漂移）
        run: pnpm run tokens:check

      - name: Tokens lint（禁止新增裸 hex）
        run: pnpm run tokens:lint

      - name: Docs check（CEM / 清单 / API 文档 / llms 与源码同步）
        run: pnpm run docs:check

      - name: AI 页面样例检查（组件 API / 图标 / 令牌）
        run: pnpm --filter @aiyazone/portal run check:ai-demo

      - name: Build storybook（视觉回归前置）
        run: pnpm --filter @aiyazone/storybook run build:storybook

      - name: Storybook test-runner（79 stories 渲染冒烟，playwright-core 起 Chromium）
        run: |
          pnpm --filter @aiyazone/storybook exec playwright-core install chromium
          pnpm --filter @aiyazone/storybook run test:storybook

      - name: Visual regression（Chromatic，未配置 Secret 时跳过）
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        working-directory: apps/storybook
        run: pnpm exec chromatic --storybook-build-dir=storybook-static --exit-once-uploaded
