<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图标库 · AIYAZONE Design System</title>
    <link rel="stylesheet" href="/shared/site-header.css" />
    <link rel="stylesheet" href="/shared/site-footer.css" />
    <style>
      :root { --ink:var(--portal-text); --muted:var(--portal-muted); --line:var(--portal-line); --brand:var(--portal-accent); --bg:var(--portal-bg); }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, -apple-system, "PingFang SC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
      main { max-width: 1280px; margin: 0 auto; padding: 64px 40px 80px; }
      h1 { font-size: clamp(32px,4vw,44px); letter-spacing:-.02em; margin: 0 0 16px; }
      .sub { color: var(--muted); font-size: .92rem; margin: 0 0 24px; }
      .sub code { background:var(--portal-surface); padding:2px 6px; border-radius:4px; font-family: ui-monospace, monospace; font-size:.86em; }

      .toolbar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px; position:sticky; top:76px; z-index:5;
        background:var(--bg); padding:12px 0; border-bottom:1px solid var(--line); }
      .search { flex:1 1 260px; max-width:420px; min-height:52px; display:flex; align-items:center; gap:8px; background:var(--portal-surface); border:1px solid var(--line);
        border-radius:10px; padding:8px 12px; }
      .search input { border:none; flex:1; min-width:0; font-size:.92rem; background:transparent; color:var(--ink); }
      .tabs { display:flex; flex-wrap:wrap; gap:6px; background:var(--portal-surface); border:1px solid var(--line); border-radius:10px; padding:4px; }
      .tabs button { border:none; min-height:44px; background:transparent; padding:6px 14px; border-radius:7px; font-size:.86rem; cursor:pointer; color:var(--muted); }
      .tabs button.active { background:var(--brand); color:var(--portal-on-accent); font-weight:600; }
      .sizes { display:flex; gap:6px; background:var(--portal-surface); border:1px solid var(--line); border-radius:10px; padding:4px; }
      .sizes button { border:none; min-height:44px; background:transparent; padding:6px 12px; border-radius:7px; font-size:.82rem; cursor:pointer; color:var(--muted); }
      .sizes button.active { background:var(--portal-raised); color:var(--ink); font-weight:600; }
      .count { color:var(--muted); font-size:.86rem; }

      .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap:12px; margin-top:20px; }
      .card { background:var(--portal-surface); border:1px solid var(--line); border-radius:12px; padding:18px 12px 12px; text-align:center;
        cursor:pointer; transition: border-color .15s, transform .15s; position:relative; }
      .card:hover { border-color: var(--brand); transform: translateY(-2px); }
      .card .glyph { height:34px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
      .card:hover .glyph { color: var(--brand); }
      .card .glyph svg { width:var(--icon-size, 24px); height:var(--icon-size, 24px); }
      .card .name { margin-top:10px; font-size:.78rem; font-family: ui-monospace, monospace; color:var(--muted);
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .card .cat { font-size:.68rem; color:var(--muted); margin-top:2px; }
      .card.copied { border-color: var(--brand); }
      .card .tip { position:absolute; top:8px; right:8px; font-size:.66rem; color:var(--portal-on-accent); background:var(--brand);
        border-radius:999px; padding:2px 8px; opacity:0; transition:opacity .15s; }
      .card.copied .tip { opacity:1; }
      .empty { color:var(--muted); text-align:center; padding:48px 0; }
      .notice { background:var(--portal-surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; color:var(--muted); font-size:.86rem; margin-bottom:16px; }
      @media(max-width:700px) { main { padding:40px 20px 64px; } .toolbar { position:static; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    </style>
  </head>
  <body>
    <div class="tech-bg"></div>
    <div id="site-header"></div>
    <main>
      <h1>找到图标，点击复制名称</h1>
      <p class="sub">按名称搜索，选择分类和大小。点击图标后，将名称粘贴到你的页面代码中。</p>
      <details><summary>如何在页面中使用图标</summary><pre>&lt;zone-icon name="home-line-2"&gt;&lt;/zone-icon&gt;</pre><p>颜色跟随文字颜色，大小可通过 <code>--zone-font-size-*</code> 样式变量设置。</p></details>
      <div class="notice" id="loading">加载图标清单…</div>
      <button class="site-button" id="retry" type="button" hidden>重新加载图标</button>
      <p class="site-note" id="copy-status" role="status"></p>
      <div class="toolbar" id="toolbar" hidden>
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" aria-label="搜索图标名称" placeholder="搜索图标名…" autocomplete="off" />
        </label>
        <div class="tabs" id="tabs"></div>
        <div class="sizes" id="sizes">
          <button data-size="16">16</button>
          <button data-size="24" class="active">24</button>
          <button data-size="32">32</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>没有匹配的图标</div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/shared/site-header.js"></script>
    <script type="module" src="/shared/site-footer.js"></script>
    <script type="module">
      import { copyText } from '/shared/copy-text.js';
      const CAT_LABEL = { system: '系统图标', 'social-media': '社媒图标' };
      let manifest = null;
      let activeCat = 'all';
      let iconSize = 24;
      let query = '';
      const svgCache = new Map();

      async function fetchSvg(cat, name) {
        const key = cat + '/' + name;
        if (!svgCache.has(key)) {
          svgCache.set(key, fetch(`/icons/assets/${cat}/${name}.svg`).then((r) => r.ok ? r.text() : '').catch(() => ''));
        }
        return svgCache.get(key);
      }

      function allIcons() {
        return manifest.categories.flatMap((c) => c.icons.map((name) => ({ category: c.category, name })));
      }

      function render() {
        const grid = document.getElementById('grid');
        const list = allIcons().filter((i) => (activeCat === 'all' || i.category === activeCat) && i.name.includes(query));
        grid.innerHTML = '';
        grid.style.setProperty('--icon-size', iconSize + 'px');
        for (const item of list) {
          const card = document.createElement('button');
          card.className = 'card';
          card.type = 'button';
          card.setAttribute('aria-label', '复制图标名 ' + item.name);
          card.innerHTML = `<span class="tip">已复制</span><div class="glyph" aria-hidden="true"></div>
            <div class="name">${item.name}</div><div class="cat">${CAT_LABEL[item.category] || item.category}</div>`;
          card.addEventListener('click', async () => {
            const copied = await copyText(item.name);
            const status = document.getElementById('copy-status');
            status.textContent = copied ? `已复制：${item.name}` : `复制失败，请手动复制：${item.name}`;
            if (copied) {
              card.classList.add('copied');
              setTimeout(() => card.classList.remove('copied'), 1200);
            }
          });
          fetchSvg(item.category, item.name).then((svg) => {
            if (svg) card.querySelector('.glyph').innerHTML = svg;
            else {
              card.querySelector('.glyph').textContent = '加载失败';
              document.getElementById('retry').hidden = false;
              document.getElementById('loading').hidden = false;
              document.getElementById('loading').textContent = '图标加载失败，请重试';
            }
          });
          grid.appendChild(card);
        }
        document.getElementById('empty').hidden = list.length > 0;
        document.getElementById('count').textContent = `${list.length} 个图标`;
      }

      function renderTabs() {
        const tabs = document.getElementById('tabs');
        const items = [{ key: 'all', label: '全部' },
          ...manifest.categories.map((c) => ({ key: c.category, label: `${CAT_LABEL[c.category] || c.category} ${c.icons.length}` }))];
        tabs.innerHTML = '';
        for (const t of items) {
          const b = document.createElement('button');
          b.textContent = t.label;
          b.setAttribute('aria-pressed', String(t.key === activeCat));
          if (t.key === activeCat) b.classList.add('active');
          b.addEventListener('click', () => { activeCat = t.key; renderTabs(); render(); });
          tabs.appendChild(b);
        }
      }

      document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });
      document.getElementById('sizes').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-size]');
        if (!b) return;
        iconSize = Number(b.dataset.size);
        document.querySelectorAll('#sizes button').forEach((x) => { x.classList.toggle('active', x === b); x.setAttribute('aria-pressed', String(x === b)); });
        render();
      });

      function loadIcons() {
      document.getElementById('retry').hidden = true;
      document.getElementById('loading').hidden = false;
      document.getElementById('loading').textContent = '加载图标清单…';
      svgCache.clear();
      fetch('/icons/icons-manifest.json')
        .then((r) => { if (!r.ok) throw new Error('加载失败'); return r.json(); })
        .then((m) => {
          manifest = m;
          document.getElementById('loading').hidden = true;
          document.getElementById('toolbar').hidden = false;
          renderTabs();
          render();
        })
        .catch(() => {
          document.getElementById('loading').textContent = '图标加载失败，请重试';
          document.getElementById('retry').hidden = false;
        });
      }
      document.getElementById('retry').addEventListener('click', loadIcons);
      loadIcons();
    </script>
  </body>
</html>
