<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图标库 · AIYAZONE Design System</title>
    <link rel="stylesheet" href="/shared/site-header.css" />
    <link rel="stylesheet" href="/shared/site-footer.css" />
    <style>
      :root { --ink:#1c1a17; --muted:#5b574f; --line:#e6e2da; --brand:#FD5000; --bg:#fbfaf8; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, -apple-system, "PingFang SC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
      main { max-width: 1120px; margin: 0 auto; padding: 88px 24px 80px; }
      h1 { font-size: 1.9rem; letter-spacing:-.02em; margin: 0 0 6px; }
      .sub { color: var(--muted); font-size: .92rem; margin: 0 0 24px; }
      .sub code { background:#f1eee8; padding:2px 6px; border-radius:4px; font-family: ui-monospace, monospace; font-size:.86em; }

      .toolbar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px; position:sticky; top:0; z-index:5;
        background:var(--bg); padding:12px 0; border-bottom:1px solid var(--line); }
      .search { flex:1 1 260px; max-width:420px; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
        border-radius:10px; padding:8px 12px; }
      .search input { border:none; outline:none; flex:1; font-size:.92rem; background:transparent; color:var(--ink); }
      .tabs { display:flex; gap:6px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:4px; }
      .tabs button { border:none; background:transparent; padding:6px 14px; border-radius:7px; font-size:.86rem; cursor:pointer; color:var(--muted); }
      .tabs button.active { background:var(--brand); color:#fff; font-weight:600; }
      .sizes { display:flex; gap:6px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:4px; }
      .sizes button { border:none; background:transparent; padding:6px 10px; border-radius:7px; font-size:.82rem; cursor:pointer; color:var(--muted); }
      .sizes button.active { background:#f1eee8; color:var(--ink); font-weight:600; }
      .count { color:var(--muted); font-size:.86rem; }

      .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap:12px; margin-top:20px; }
      .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 12px 12px; text-align:center;
        cursor:pointer; transition: border-color .15s, transform .15s; position:relative; }
      .card:hover { border-color: var(--brand); transform: translateY(-2px); }
      .card .glyph { height:34px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
      .card:hover .glyph { color: var(--brand); }
      .card .glyph svg { width:var(--icon-size, 24px); height:var(--icon-size, 24px); }
      .card .name { margin-top:10px; font-size:.78rem; font-family: ui-monospace, monospace; color:var(--muted);
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .card .cat { font-size:.68rem; color:#b6b1a7; margin-top:2px; }
      .card.copied { border-color: var(--brand); }
      .card .tip { position:absolute; top:8px; right:8px; font-size:.66rem; color:#fff; background:var(--brand);
        border-radius:999px; padding:2px 8px; opacity:0; transition:opacity .15s; }
      .card.copied .tip { opacity:1; }
      .empty { color:var(--muted); text-align:center; padding:48px 0; }
      .notice { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; color:var(--muted); font-size:.86rem; margin-bottom:16px; }
    </style>
  </head>
  <body>
    <div class="tech-bg"></div>
    <div id="site-header"></div>
    <main>
      <h1>图标库</h1>
      <p class="sub">用法：<code>&lt;zone-icon name="图标名"&gt;</code> —— 颜色随 <code>currentColor</code>，大小随 <code>font-size</code>（用 <code>--zone-font-size-*</code> 令牌）。点击卡片复制图标名。</p>
      <div class="notice" id="loading">加载图标清单…</div>
      <div class="toolbar" id="toolbar" hidden>
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5b574f" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="搜索图标名…" autocomplete="off" />
        </label>
        <div class="tabs" id="tabs"></div>
        <div class="sizes" id="sizes">
          <button data-size="16">16</button>
          <button data-size="24" class="active">24</button>
          <button data-size="32">32</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>没有匹配的图标</div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="/shared/site-header.js"></script>
    <script type="module" src="/shared/site-footer.js"></script>
    <script type="module">
      const CAT_LABEL = { system: '系统图标', 'social-media': '社媒图标' };
      let manifest = null;
      let activeCat = 'all';
      let iconSize = 24;
      let query = '';
      const svgCache = new Map();

      async function fetchSvg(cat, name) {
        const key = cat + '/' + name;
        if (!svgCache.has(key)) {
          svgCache.set(key, fetch(`/icons/assets/${cat}/${name}.svg`).then((r) => r.ok ? r.text() : '').catch(() => ''));
        }
        return svgCache.get(key);
      }

      function allIcons() {
        return manifest.categories.flatMap((c) => c.icons.map((name) => ({ category: c.category, name })));
      }

      function render() {
        const grid = document.getElementById('grid');
        const list = allIcons().filter((i) => (activeCat === 'all' || i.category === activeCat) && i.name.includes(query));
        grid.innerHTML = '';
        grid.style.setProperty('--icon-size', iconSize + 'px');
        for (const item of list) {
          const card = document.createElement('button');
          card.className = 'card';
          card.type = 'button';
          card.setAttribute('aria-label', '复制图标名 ' + item.name);
          card.innerHTML = `<span class="tip">已复制</span><div class="glyph" aria-hidden="true"></div>
            <div class="name">${item.name}</div><div class="cat">${CAT_LABEL[item.category] || item.category}</div>`;
          card.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(item.name); } catch { /* 剪贴板不可用时静默 */ }
            card.classList.add('copied');
            setTimeout(() => card.classList.remove('copied'), 1200);
          });
          fetchSvg(item.category, item.name).then((svg) => {
            if (svg) card.querySelector('.glyph').innerHTML = svg;
          });
          grid.appendChild(card);
        }
        document.getElementById('empty').hidden = list.length > 0;
        document.getElementById('count').textContent = `${list.length} 个图标`;
      }

      function renderTabs() {
        const tabs = document.getElementById('tabs');
        const items = [{ key: 'all', label: '全部' },
          ...manifest.categories.map((c) => ({ key: c.category, label: `${CAT_LABEL[c.category] || c.category} ${c.icons.length}` }))];
        tabs.innerHTML = '';
        for (const t of items) {
          const b = document.createElement('button');
          b.textContent = t.label;
          if (t.key === activeCat) b.classList.add('active');
          b.addEventListener('click', () => { activeCat = t.key; renderTabs(); render(); });
          tabs.appendChild(b);
        }
      }

      document.getElementById('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });
      document.getElementById('sizes').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-size]');
        if (!b) return;
        iconSize = Number(b.dataset.size);
        document.querySelectorAll('#sizes button').forEach((x) => x.classList.toggle('active', x === b));
        render();
      });

      fetch('/icons/icons-manifest.json')
        .then((r) => r.json())
        .then((m) => {
          manifest = m;
          document.getElementById('loading').hidden = true;
          document.getElementById('toolbar').hidden = false;
          renderTabs();
          render();
        })
        .catch(() => {
          document.getElementById('loading').textContent = '图标清单加载失败：请确认构建产物包含 icons-manifest.json（pnpm build-all 后访问）。';
        });
    </script>
  </body>
</html>
