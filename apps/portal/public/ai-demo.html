<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账户设置示例 · AIYAZONE</title>
  <link rel="stylesheet" href="/shared/site-header.css" />
  <link rel="stylesheet" href="/shared/site-footer.css" />
  <!-- 知识来源：design.aiyazone.com/llms-full.txt（按其快速使用三步接入，CDN 直用 npm 包） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@aiyazone/design-system@0.5.0/dist/index-v3.css" />
  <script type="module">
    import 'https://cdn.jsdelivr.net/npm/@aiyazone/design-system@0.5.0/dist/cdn/index.js';
  </script>
  <style>
    .page-title { font-size: var(--zone-font-size-24); margin: 0 0 var(--zone-size-4); }
    .page-desc  { color: var(--zone-color-neutral); opacity: .6; margin: 0 0 var(--zone-size-24); }
    .card {
      background: var(--zone-color-white);
      border-radius: var(--zone-rounded-12);
      padding: var(--zone-size-24);
      margin-bottom: var(--zone-size-16);
    }
    .card-head { display: flex; align-items: center; gap: var(--zone-size-8); margin-bottom: var(--zone-size-16); }
    .card-head zone-icon { font-size: var(--zone-font-size-20); color: var(--zone-color-primary); }
    .card-head h2 { font-size: var(--zone-font-size-16); margin: 0; }
    .field { margin-bottom: var(--zone-size-16); }
    .field--fill { flex: 1; min-width: 12rem; }
    .field__control { width: 100%; }
    .field label { display: block; margin-bottom: var(--zone-size-8); font-size: var(--zone-font-size-14); }
    /* 当前没有通用输入框组件，因此此页使用原生 input。 */
    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: var(--zone-size-8) var(--zone-size-12);
      font-size: var(--zone-font-size-14);
      font-family: inherit;
      color: var(--zone-color-neutral);
      background: var(--zone-color-white);
      border: 1px solid var(--zone-color-grey);
      border-radius: var(--zone-rounded-8);
      outline: none;
    }
    .field input:focus-visible { border-color: var(--zone-color-primary); }
    .row { display: flex; gap: var(--zone-size-24); flex-wrap: wrap; }
    .prefs { display: grid; gap: var(--zone-size-12); }
    .danger { border: 1px solid var(--zone-color-danger); }
    .danger .card-head zone-icon { color: var(--zone-color-danger); }
    .danger p { opacity: .6; margin: 0 0 var(--zone-size-16); }
    .dialog-copy { margin: 0 0 var(--zone-size-16); }
    .actions { display: flex; justify-content: flex-end; gap: var(--zone-size-12); margin-top: var(--zone-size-24); }
    .actions--dialog { margin-top: 0; }
  </style>
</head>
<body>
  <div data-site-header></div>
  <main class="site-main account-demo-shell" id="content">
    <p class="site-eyebrow">页面示例</p>
    <h1>账户设置示例</h1>
    <p class="site-lede">试试资料填写、时区选择、通知切换和弹窗。所有操作仅供演示，不会修改真实账户。</p>
    <div class="example-preview">

    <section class="card" aria-labelledby="h-profile">
      <div class="card-head">
        <zone-icon name="home-line-2" aria-hidden="true"></zone-icon>
        <h2 id="h-profile">基本资料</h2>
      </div>
      <div class="row">
        <div class="field field--fill">
          <label for="nick">昵称</label>
          <input id="nick" type="text" value="Zone 用户" autocomplete="nickname" />
        </div>
        <div class="field field--fill">
          <label for="tz">时区</label>
          <zone-dropdown id="tz" class="field__control"></zone-dropdown>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="h-pref">
      <div class="card-head">
        <zone-icon name="lamp-line" aria-hidden="true"></zone-icon>
        <h2 id="h-pref">通知偏好</h2>
      </div>
      <div class="prefs">
        <zone-checkbox name="mail" checked>邮件通知（订单与物流）</zone-checkbox>
        <zone-checkbox name="sms">短信通知（仅安全事件）</zone-checkbox>
      </div>
    </section>

    <section class="card danger" aria-labelledby="h-danger">
      <div class="card-head">
        <zone-icon name="delete-line" aria-hidden="true"></zone-icon>
        <h2 id="h-danger">危险操作</h2>
      </div>
      <p>这里演示删除确认流程，不会删除任何真实数据。</p>
      <zone-button id="del" size="medium" kind="danger" variant="secondary" icon="delete-fill" icon-position="prev">删除账户</zone-button>
      <zone-dialog id="confirm" caption="确认删除账户？" aria-label-text="确认删除账户" size="large">
        <p class="dialog-copy">确定完成这次删除演示吗？不会删除真实账户或数据。</p>
        <div class="actions actions--dialog">
          <zone-button id="cancel" size="medium" variant="text">取消</zone-button>
          <zone-button id="confirm-del" size="medium" kind="danger">确认删除</zone-button>
        </div>
      </zone-dialog>
    </section>

    </div>
  </main>
  <div data-site-footer></div>
  <script type="module" src="/shared/site-header.js"></script>
  <script type="module" src="/shared/site-footer.js"></script>

  <zone-toast id="toast" closed countdown-time="3" closable aria-live="polite"></zone-toast>

  <script type="module">
    // 时区下拉（选项由公开的 options 属性传入；此处为单层列表）
    const tz = document.getElementById('tz');
    tz.options = [
      { value: 'cst', label: '中国标准时间 UTC+8' },
      { value: 'jst', label: '日本标准时间 UTC+9' },
      { value: 'pst', label: '太平洋时间 UTC-8' },
    ];

    // 保存偏好（声明式 toast：设 variant/caption/description 后置 closed=false）
    const toast = document.getElementById('toast');
    function showToast(type, caption, description) {
      toast.setAttribute('variant', type);
      toast.setAttribute('caption', caption);
      toast.setAttribute('description', description);
      toast.closed = false;
    }
    document.querySelectorAll('zone-checkbox').forEach((c) =>
      c.addEventListener('change', () => showToast('success', '演示设置已保存', '通知偏好仅在本页演示中更新'))
    );

    // 危险操作确认流：dialog → toast
    const dialog = document.getElementById('confirm');
    document.getElementById('del').addEventListener('zone-click', () => (dialog.open = true));
    document.getElementById('cancel').addEventListener('zone-click', () => (dialog.open = false));
    document.getElementById('confirm-del').addEventListener('zone-click', () => {
      dialog.open = false;
      showToast('warning', '删除演示已完成', '没有删除真实账户或数据');
    });
  </script>
</body>
</html>
