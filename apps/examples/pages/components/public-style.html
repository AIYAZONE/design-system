<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="/shared/site-color-mode.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Style - 通用样式技巧</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="/main.ts"></script>
  </head>

  <body data-example-page="components/public-style">
    <div class="container examples-layout">
      <div class="examples-workspace">
        <header class="header">
          <a href="/" class="logo">
            <img src="/favicon.svg" alt="AIYAZONE Logo" />
          </a>
          <div class="content">
            <h1>通用样式示例</h1>
            <p class="subtitle">设计系统中的通用样式使用技巧和注意事项</p>
          </div>
        </header>

        <main class="example-preview" id="content">
          <section class="example-section">
            <header class="example-section__heading">
              <span class="example-section__number">01</span>
              <h2 id="section-1" class="example-section__title">
                本项目LESS文件 变量对应值使用 @rem计算失效
              </h2>
            </header>
            <div class="example-canvas">
              <section>
                <pre>
        @rem: (1rem / 16);
        .button {
          --height: 80 * @rem;            // Error - 失效
          --height: max(0, 80 * @rem);    // 80px等效尺寸 - 生效
          height: 80 * @rem;              // 80px等效尺寸 - 生效
        }
        </pre>
              </section>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
