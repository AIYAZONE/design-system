<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="/shared/site-color-mode.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropdown · AIYAZONE Design System</title>
    <script type="module" src="./dropdown-demo.ts"></script>
    <style>
      .intro {
        margin-bottom: 40px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 40px;
      }
      section {
        min-width: 0;
      }
      .tree-section {
        min-height: 460px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .actions button {
        background: #242f20;
        color: #fff;
        border: 0;
        padding: 10px 16px;
        cursor: pointer;
      }
      output {
        display: block;
        margin-top: 12px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .clipped {
        overflow: hidden;
        height: 100px;
        border: 1px dashed #c6c7c8;
        padding: 16px;
        margin-top: 40px;
      }
      .reference {
        width: 524px;
        max-width: 100%;
      }
      body[data-view="pc"] main {
        padding-top: 80px;
      }
      body[data-view="mb"] main {
        padding: 40px 32px;
      }
      body[data-view="mb"] .reference {
        width: 311px;
      }
      body[data-view] .intro,
      body[data-view] .flat-section,
      body[data-view] .checks-section,
      body[data-view] .clipped,
      body[data-view] .tree-section h2 {
        display: none;
      }
      body[data-view] .grid {
        display: block;
      }
      @media (max-width: 1023.98px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .tree-section {
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body data-example-page="atoms/dropdown">
    <div class="container examples-layout">
      <div class="examples-workspace">
        <header class="header">
          <div class="content">
            <h1>下拉选择示例</h1>
            <p class="subtitle">选择单个选项，支持普通列表、分组与表单。</p>
          </div>
        </header>
        <main class="example-preview" id="content">
          <section class="example-section">
            <header class="example-section__heading">
              <span class="example-section__number">01</span>
              <h2 id="section-1" class="example-section__title">交互演示</h2>
            </header>
            <div class="example-canvas">
              <div class="grid">
                <section class="tree-section">
                  <h2>分组选择</h2>
                  <div class="reference">
                    <zone-dropdown
                      id="tree"
                      label="Issue Type"
                      placeholder="Select issue type"
                      required=""
                    ></zone-dropdown>
                  </div>
                </section>
                <section class="flat-section">
                  <h2>普通选择与表单</h2>
                  <form id="form">
                    <zone-dropdown
                      id="flat"
                      label="Product category"
                      name="category"
                      placeholder="Select category"
                      required=""
                      clearable=""
                    ></zone-dropdown>
                    <div class="actions">
                      <button type="submit">提交</button
                      ><button type="reset">重置</button
                      ><button type="button" id="toggle-disabled">
                        切换禁用状态
                      </button>
                    </div>
                    <fieldset
                      id="fieldset"
                      style="border: 0; padding: 0; margin: 24px 0 0"
                    >
                      <zone-dropdown
                        id="fieldset-dropdown"
                        label="Accessory"
                        name="accessory"
                      ></zone-dropdown>
                    </fieldset>
                    <output id="form-result" aria-live="polite"></output>
                  </form>
                </section>
              </div>
              <div class="clipped">
                <zone-dropdown
                  id="clipped"
                  label="Inside overflow: hidden"
                  placeholder="Open to check popup clipping"
                ></zone-dropdown>
              </div>
            </div>
          </section>
          <section class="example-section">
            <header class="example-section__heading">
              <span class="example-section__number">02</span>
              <h2 id="section-2" class="example-section__title">
                5000 项长文本虚拟列表
              </h2>
            </header>
            <div class="example-canvas">
              <section class="checks-section" style="margin-top: 32px">
                <zone-dropdown
                  id="large"
                  label="Large list"
                  placeholder="选择选项以检查滚动和换行"
                ></zone-dropdown>
                <div class="actions">
                  <button type="button" id="open-dialog">
                    打开包含下拉选择的弹窗
                  </button>
                </div>
                <zone-dialog
                  id="audit-dialog"
                  caption="Dropdown keyboard isolation"
                >
                  <zone-dropdown
                    id="dialog-dropdown"
                    label="Dialog dropdown"
                  ></zone-dropdown>
                </zone-dialog>
                <div class="actions">
                  <button type="button" id="run-checks" disabled="">
                    运行交互检查
                  </button>
                </div>
                <output id="checks-result" aria-live="polite"></output>
              </section>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
