<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast - 轻提示</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- 统一使用示例站主入口脚本，集中引入样式与组件注册 -->
  <script type="module" src="/main.ts"></script>
</head>

<body>
  <div class="container">
    <header class="header">
      <a href="/" class="logo">
        <img src="/favicon.svg" alt="AIYAZONE Logo" />
      </a>
      <div class="content">
        <h1>Toast 轻提示组件</h1>
        <p class="subtitle">各种样式和状态的轻提示展示</p>
      </div>
    </header>

    <main>
      <h2>轻提示样式</h2>
      <p>
        <zone-toast icon>Info Variant</zone-toast>
        <zone-toast variant="warning" icon>Warning Variant</zone-toast>
        <zone-toast variant="success" icon>Success Variant</zone-toast>
        <zone-toast variant="success" countdownTime="5" icon>Success Variant</zone-toast>
        <zone-toast variant="danger" icon>Danger Variant</zone-toast>
        <zone-toast variant="danger">Danger Text
          <zone-button slot="action">Action Link</zone-button>
          <zone-button slot="action-secondary">Action Link</zone-button>
        </zone-toast>
      </p>
    </main>
  </div>
</body>

</html>
