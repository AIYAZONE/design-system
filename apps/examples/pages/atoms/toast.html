<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="/shared/site-color-mode.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast - 轻提示</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 统一使用示例站主入口脚本，集中引入样式与组件注册 -->
    <script type="module" src="/main.ts"></script>
  </head>

  <body data-example-page="atoms/toast">
    <div class="container examples-layout">
      <div class="examples-workspace">
        <header class="header">
          <a href="/" class="logo">
            <img src="/favicon.svg" alt="AIYAZONE Logo" />
          </a>
          <div class="content">
            <h1>消息提示示例</h1>
            <p class="subtitle">各种样式和状态的轻提示展示</p>
          </div>
        </header>

        <main class="example-preview" id="content">
          <section class="example-section">
            <header class="example-section__heading">
              <span class="example-section__number">01</span>
              <h2 id="section-1" class="example-section__title">轻提示样式</h2>
            </header>
            <div class="example-canvas">
              <p class="demo-row"></p>
              <div class="notification-example">
                <zone-toast icon="">Info Variant</zone-toast>
              </div>
              <div class="notification-example">
                <zone-toast variant="warning" icon=""
                  >Warning Variant</zone-toast
                >
              </div>
              <div class="notification-example">
                <zone-toast variant="success" icon=""
                  >Success Variant</zone-toast
                >
              </div>
              <div class="notification-example">
                <zone-toast
                  variant="success"
                  icon=""
                  countdown-time="5"
                  id="timed-toast"
                  >Success Variant</zone-toast
                ><button
                  type="button"
                  class="example-tool"
                  data-replay-toast="timed-toast"
                >
                  重新演示倒计时
                </button>
              </div>
              <div class="notification-example">
                <zone-toast variant="danger" icon="">Danger Variant</zone-toast>
              </div>
              <div class="notification-example">
                <zone-toast variant="danger"
                  >Danger Text
                  <zone-button slot="action">Action Link</zone-button>
                  <zone-button slot="action-secondary">Action Link</zone-button>
                </zone-toast>
              </div>
              <p></p>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
