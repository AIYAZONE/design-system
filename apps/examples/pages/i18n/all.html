<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i18n 全量翻译表格</title>
    <script type="module" src="/main.ts"></script>
    <script type="module" src="/pages/i18n/index.ts"></script>
    <script type="module" src="/pages/i18n/i18n-all.js"></script>
  </head>
  <body data-example-page="i18n/all">
    <div class="container examples-layout">
      <div class="examples-workspace">
        <header class="header">
          <a href="/" class="logo">
            <img src="/favicon.svg" alt="AIYAZONE Logo" />
          </a>
          <div class="content">
            <h1>全部翻译表格</h1>

            </p>
          </div>
        </header>
        <main class="example-preview" id="content">
          <section class="example-section">
            <header class="example-section__heading">
              <span class="example-section__number">01</span>
              <h2 id="section-1" class="example-section__title">翻译数据</h2>
            </header>
            <div class="example-canvas">
              <div id="tools"></div>
              <div id="table-root"></div>
            </div>
          </section>
        </main>
      </div>
    </div>
