<script>
(function() {
  var NAV_LINKS = [
    { href: '/index.html', text: '概览' },
    { href: '/storybook/', text: '文档' },
    { href: '/examples/', text: '示例' },
    { href: '/icons/', text: '图标' },
  ];

  var normalizePath = function(path) {
    return path.endsWith('/') ? path : path + '/';
  };

  var getActivePath = function(pathname) {
    var p = normalizePath(pathname);
    if (p.indexOf('/storybook/') === 0) return '/storybook/';
    if (p.indexOf('/examples/') === 0) return '/examples/';
    if (p.indexOf('/icons/') === 0) return '/icons/';
    return '/';
  };

  var renderHeader = function() {
    var active = getActivePath(window.location.pathname);
    var links = NAV_LINKS.map(function(l) {
      var linkPath = normalizePath(l.href);
      var isActive = linkPath === active;
      var cls = 'portal-nav__link' + (isActive ? ' is-active' : '');
      var current = isActive ? ' aria-current="page"' : '';
      return '<a class="' + cls + '" href="' + l.href + '"' + current + '>' + l.text + '</a>';
    }).join('');

    return '<div class="portal-topbar__inner">' +
      '<a href="/index.html" class="portal-brand">' +
        '<span class="portal-brand__mark">ZONE</span>' +
        '<span class="portal-brand__text">' +
          '<span>AIYAZONE</span>' +
          '<span class="portal-brand__accent">Design System</span>' +
        '</span>' +
      '</a>' +
      '<nav class="portal-nav" aria-label="主导航">' +
        links +
      '</nav>' +
    '</div>';
  };

  var HEADER_STYLES = ':root{--site-header-bg:rgba(255,255,255,0.82);--site-header-border:rgba(0,0,0,0.08);--site-header-ink:#111827;--site-header-muted:#4b5563;--site-header-brand:#ff5000;--portal-header-height:60px}body{margin:0!important;padding:0!important}#root{margin-top:var(--portal-header-height)!important;height:calc(100vh - var(--portal-header-height))!important}.css-1nolumm,.css-1rkkere{height:100%!important}.portal-topbar{position:fixed;top:0;left:0;right:0;z-index:10000;width:100%;height:var(--portal-header-height);background:var(--site-header-bg);border-bottom:1px solid var(--site-header-border);backdrop-filter:blur(12px);box-sizing:border-box}.portal-topbar__inner{display:flex;align-items:center;gap:24px;max-width:1280px;margin:0 auto;padding:12px 24px;height:100%;box-sizing:border-box}.portal-brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--site-header-ink);font-weight:700;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap;font-size:1.25rem}.portal-brand__mark{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:0.5rem;background:var(--site-header-brand);color:#fff;font-size:0.75rem;font-weight:700;letter-spacing:0}.portal-brand__text{display:inline-flex;align-items:baseline;gap:8px}.portal-brand__accent{color:var(--site-header-brand)}.portal-nav{display:flex;align-items:center;gap:24px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;margin-left:auto}.portal-nav::-webkit-scrollbar{display:none}.portal-nav__link{position:relative;display:inline-flex;align-items:center;text-decoration:none;font-size:0.875rem;font-weight:500;color:var(--site-header-muted);padding:8px 0;transition:color 0.2s ease;white-space:nowrap}.portal-nav__link:hover{color:var(--site-header-brand)}.portal-nav__link.is-active{color:var(--site-header-brand)}.portal-nav__link.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:rgba(255,80,0,0.85);border-radius:2px}';

  var injectStyles = function() {
    if (document.querySelector('style[data-portal-header]')) return;
    var style = document.createElement('style');
    style.setAttribute('data-portal-header', 'true');
    style.textContent = HEADER_STYLES;
    var head = document.head || document.getElementsByTagName('head')[0];
    if (head) head.appendChild(style);
  };

  var injectHeader = function() {
    if (document.querySelector('.portal-topbar')) return;
    var header = document.createElement('header');
    header.className = 'portal-topbar';
    header.innerHTML = renderHeader();
    document.body.insertAdjacentElement('afterbegin', header);
  };

  var mount = function() {
    injectStyles();
    injectHeader();
  };

  var tryMount = function() {
    if (document.head && document.body) {
      mount();
      return true;
    }
    return false;
  };

  if (!tryMount()) {
    var interval = setInterval(function() {
      if (tryMount()) {
        clearInterval(interval);
      }
    }, 10);
    setTimeout(function() {
      clearInterval(interval);
    }, 5000);
  }
})();
</script>
